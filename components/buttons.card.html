<!-- @dsCard group="Components" viewport="900x720" name="Button" subtitle="Primary: no icon / with icon × Size × Style, states, colors" -->
<link rel="stylesheet" href="../styles.css">
<script src="../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<div id="root" style="background:rgb(18,19,22);padding:24px 28px;font-family:var(--font-sans)"></div>
<script type="text/babel" data-presets="react">
const { Button } = window.BroGameDesignSystem_84b2ac;
const h = React.createElement;
const lab = {fontSize:12,color:'rgb(140,140,140)',fontWeight:500};
const Title = ({t}) => h('div',{style:{fontSize:16,fontWeight:600,color:'#fff',margin:'0 0 14px',paddingBottom:8,borderBottom:'1px solid rgba(255,255,255,.14)'}},t);
const Sec = ({t,children}) => h('div',{style:{marginBottom:32}},h(Title,{t}),children);
const styles=[['fill','Fill'],['outline','Outline'],['ghost','Ghost'],['disable','Disabled']];
const sizes=[['lg','L'],['md','M'],['sm','S']];
const Grid = ({icon}) => h('div',{style:{display:'grid',gridTemplateColumns:'40px repeat(4, minmax(0,1fr))',gap:'14px 16px',alignItems:'center'}},
  h('div'), ...styles.map(([,n])=>h('div',{key:n,style:lab},n)),
  ...sizes.flatMap(([s,sn])=>[h('div',{key:sn,style:lab},sn), ...styles.map(([st])=>h('div',{key:s+st},h(Button,{color:'primary',style2:st,size:s,showIcon:icon,label:'Button'})))])
);
const Row = ({children}) => h('div',{style:{display:'flex',flexWrap:'wrap',gap:16,alignItems:'center'}},children);
const Lb = ({t,children}) => h('div',{style:{display:'flex',flexDirection:'column',gap:8}},h('div',{style:lab},t),children);
const states=[['default','Default'],['hover','Hover'],['loading','Loading']];
ReactDOM.render(h('div',null,
  h(Sec,{t:'Primary · No icon'},h(Grid,{icon:false})),
  h(Sec,{t:'Primary · With icon'},h(Grid,{icon:true})),
  h(Sec,{t:'States · Primary Fill L'},
    h('div',{style:{display:'grid',gridTemplateColumns:'80px repeat(3, minmax(0,1fr))',gap:'14px 16px',alignItems:'center'}},
      h('div'), ...states.map(([,n])=>h('div',{key:n,style:lab},n)),
      ...[[false,'No icon'],[true,'With icon']].flatMap(([ic,n])=>[h('div',{key:n,style:lab},n), ...states.map(([s])=>h('div',{key:n+s},h(Button,{color:'primary',style2:'fill',size:'lg',state:s,loading:s==='loading',showIcon:ic,label:'Button'})))])
    )),
  h(Sec,{t:'Other colors · Fill M'},h(Row,null,...['secondary','success','warning','danger','info'].map(col=>h(Lb,{key:col,t:col[0].toUpperCase()+col.slice(1)},h(Button,{color:col,style2:'fill',size:'md',showIcon:false,label:'Button'})))))
), document.getElementById('root'));
</script>
